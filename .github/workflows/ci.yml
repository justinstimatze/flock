name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "needs gofmt:"; echo "$unformatted"; exit 1; fi
      - name: vet
        run: go vet ./...
      # staticcheck, pinned: @latest would let an upstream release turn an
      # unrelated PR red.
      - name: install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - name: staticcheck
        run: staticcheck ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
